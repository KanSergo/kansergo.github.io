<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Крановый завод</title>
<style>
:root{color-scheme:dark;--bg:#0c111d;--card:#171e30;--tx:#e8ecf5;--mu:#8c97b2;--ac:#ff8a2a;--ok:#32d27a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background-color:var(--bg)}
body{color:var(--tx);font:16px/1.4 system-ui,sans-serif}
#menu{max-width:480px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 14px calc(28px + env(safe-area-inset-bottom,0px))}

.pb{height:8px;border-radius:4px;background:#252d44;overflow:hidden;margin:6px 0 4px}.pb div{height:100%;width:0;background:linear-gradient(90deg,#1fa85f,#5af0a0);transition:width .4s}
.pt{color:var(--mu);font-size:13px;margin-bottom:16px}
.cd{display:flex;gap:14px;align-items:center;width:100%;text-align:left;margin:0 0 12px;padding:16px;border:1px solid #2a3350;border-radius:18px;background:linear-gradient(135deg,#1b243c,#141b2e);color:var(--tx);font:inherit}
.cd:active{transform:scale(.98)}
.ic{font-size:34px;width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:#252f4d;flex:none}
.cd b{font-size:17px}.cd small{display:block;color:var(--mu);font-size:13px;margin-top:2px}
.st{margin-left:auto;font-size:12px;color:var(--mu);white-space:nowrap;padding-left:6px}
.cd.dn{border-color:#1f6b45}.cd.dn .st{color:var(--ok)}
.rs{margin-top:10px;background:none;border:0;color:var(--mu);font-size:13px;text-decoration:underline}
#game{position:fixed;inset:0;display:none;flex-direction:column;background-color:var(--bg)}
#bar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:1px solid #2a3350;background:#10172a}
#bar button{padding:8px 12px;border-radius:10px;border:1px solid #33406a;background:#1f2842;color:var(--tx);font-size:14px}
#gt{font-weight:600}
#fr{flex:1;border:0;width:100%;background-color:var(--bg)}
#ov{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;padding:20px;background:#070b14e8}
.card{background:var(--card);border:1px solid #2f3a5c;border-radius:20px;padding:22px;text-align:center;max-width:320px}
.card h2{margin:0 0 8px;font-size:22px}.card p{margin:0 0 16px;color:var(--mu);font-size:14px}
.bt{display:block;width:100%;margin-top:8px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:600;background:#252f4d;color:var(--tx)}
.bt.p{background:linear-gradient(180deg,#ff9d4a,#f07a14);color:#fff}
</style></head><body>
<div id="menu"><h1>🏗️ Крановый завод</h1><div class="sub">Шесть участков. Пройдите их все, чтобы кран был принят.</div>
<div class="pb"><div id="pf"></div></div><div class="pt" id="pt"></div><div id="ls"></div><button class="rs" id="rs">Сбросить прогресс</button></div>
<div id="game"><div id="bar"><button id="bk">← Меню</button><span id="gt"></span><button id="mt" style="margin-left:auto">🔊</button></div><iframe id="fr" title="game"></iframe></div>
<div id="ov"></div>
<script>
const G={"design": "<!DOCTYPE html>\n<html lang=\"ru\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Проектирование крана<\/title>\n<style>\n:root{color-scheme:dark;--bg:#0c111d;--card:#171e30;--tx:#e8ecf5;--mu:#8c97b2;--ac:#ff8a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}\nhtml,body{background-color:var(--bg)}\nbody{margin:0;color:var(--tx);font:15px/1.4 system-ui,sans-serif}\n.w{max-width:480px;margin:0 auto;padding:10px}\n.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}\nh1{font-size:17px;margin:0}#lv{font-size:14px}\n.bar{height:10px;border-radius:5px;background:#252d44;overflow:hidden}\n#pb{height:100%;width:0;background:linear-gradient(90deg,#1fa85f,#5af0a0)}\n.chips{display:flex;gap:6px;margin:6px 0 8px;font-size:12px;color:var(--mu)}\n.chips span{flex:1;padding:6px 8px;border:1px solid #2a3350;border-radius:10px;background:var(--card);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n#sc{position:relative;border-radius:18px;overflow:hidden;border:1px solid #2a3350;box-shadow:0 8px 30px #0008;line-height:0}\ncanvas{width:100%;height:auto;display:block;touch-action:none}\n#tt{position:absolute;left:10px;right:10px;top:10px;padding:8px 12px;border-radius:12px;background:#0b1020ee;border:1px solid #3a4670;font-size:13px;line-height:1.35;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}\n#ov{position:absolute;inset:0;background:#070b14e6;display:flex;align-items:center;justify-content:center;padding:18px;line-height:1.4}\n.card{background:var(--card);border:1px solid #2f3a5c;border-radius:18px;padding:20px;text-align:center;max-width:310px}\n.card h2{margin:0 0 8px;font-size:20px}.card p{margin:0 0 14px;color:var(--mu);font-size:14px}\n.bt{width:100%;font-size:16px;font-weight:600;padding:13px;border:0;border-radius:12px;background:linear-gradient(180deg,#ff9d4a,#f07a14);color:#fff}\n#msg{margin:10px 0;color:var(--mu);font-size:13px;text-align:center}\n<\/style><\/head><body><div class=\"w\">\n<div class=\"hud\"><h1>📐 Проектирование крана<\/h1><span id=\"lv\"><\/span><\/div>\n<div class=\"bar\"><div id=\"pb\"><\/div><\/div>\n<div class=\"chips\"><span id=\"c1\"><\/span><span id=\"c2\"><\/span><\/div>\n<div id=\"sc\"><canvas id=\"cv\"><\/canvas><div id=\"tt\"><\/div><div id=\"ov\"><\/div><\/div>\n<div id=\"msg\">Нажимайте слева или справа от машины (или стрелки), чтобы менять полосу.<\/div>\n<\/div>\n<script>\n(function(){let ac=null,mute=!!window.__MUTE;\nconst cx=()=>{if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac};\naddEventListener('message',e=>{if(e.data&&typeof e.data.mute==='boolean')mute=e.data.mute});\n['pointerdown','keydown','touchstart'].forEach(v=>addEventListener(v,cx,{passive:true}));\nconst N={tap:[[620,.04,'square',.05,0]],ok:[[660,.09,'sine',.1,0],[990,.14,'sine',.1,.09]],bad:[[170,.2,'sawtooth',.1,0],[110,.25,'sawtooth',.1,.1]],item:[[784,.07,'triangle',.1,0],[988,.07,'triangle',.1,.07],[1318,.12,'triangle',.1,.14]],warn:[[880,.12,'square',.07,0],[880,.12,'square',.07,.2]],win:[[523,.14,'triangle',.12,0],[659,.14,'triangle',.12,.14],[784,.14,'triangle',.12,.28],[1047,.4,'triangle',.12,.42]],lose:[[392,.22,'sawtooth',.1,0],[311,.22,'sawtooth',.1,.22],[233,.5,'sawtooth',.1,.44]]};\nwindow.snd=n=>{if(mute)return;const a=cx();if(!a||!N[n])return;const t=a.currentTime;N[n].forEach(([f,d,ty,v,dl])=>{const o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t+dl);g.gain.exponentialRampToValueAtTime(.0001,t+dl+d);o.connect(g);g.connect(a.destination);o.start(t+dl);o.stop(t+dl+d+.02)})};\n})();\n<\/script>\n<script>\nconst $=id=>document.getElementById(id);\nconst cv=$('cv'),ctx=cv.getContext('2d'),W=360,H=520,DPR=Math.min(2,window.devicePixelRatio||1);\ncv.width=W*DPR;cv.height=H*DPR;\nconst R=n=>Math.floor(Math.random()*n),LX=[90,180,270],PY=430;let TOTAL=17000,P,LD='norm';\nconst CAPS=[5,8,10,12,16,20],SUPS=['Редукторы-Урал','завод «Прогресс»','ТехПривод','поставщик из Китая','импортозамещённый ИИ-12'];\nconst HZ=[\n {id:'tz',e:'⚖️',l:['ТЗ изменено:','грузоподъёмность'],c:'#c0392b'},\n {id:'sup',e:'⚙️',l:['Новый поставщик','редуктора'],c:'#a8561f'},\n {id:'fix',e:'✏️',l:['Правки','заказчика'],c:'#8e44ad'},\n {id:'app',e:'🕒',l:['Согласование','3 недели'],c:'#2c6aa8'},\n {id:'gost',e:'📜',l:['Новый ГОСТ','посреди проекта'],c:'#4a7a3a'},\n {id:'calc',e:'🧮',l:['Не сошёлся','расчёт прочности'],c:'#b8394f'},\n {id:'dead',e:'⏳',l:['Срок сдвинули','ближе на неделю'],c:'#9a6a14'}\n];\nconst WIDE={id:'wide',e:'🔄',l:['Заказчик передумал:','переделываем всё!'],c:'#7a1f2f'};\nconst PK={coffee:'☕',ok:'✅',calc:'📐'};\nlet G,last=0,raf=0,roadOff=0;\nconst FORK={id:'fork',e:'🚧',l:['Старая ветка','закрыта'],c:'#7a1f2f'};\nconst FKS={1:[.5],2:[.35,.7],3:[.25,.5,.75]};\nconst BR=['main','feature/правки-РП','release/срочно','hotfix/заказчик'];\nconst PAL=[['#101a36','#1b2c52','#2a3045','#2a3d6b'],['#12261a','#1f4029','#2a3a2e','#2f5a38'],['#26163a','#3d2552','#3a2f45','#5a3d7a'],['#30200f','#52341b','#45362a','#7a5430']];\nconst DIFF={\n easy:{n:'🟢 Лёгкий',t:'4 нерва, помедленнее, одна смена ветки',col:'linear-gradient(180deg,#3fbf6a,#1f8f48)',base:210,gain:110,gap:260,wide:.08,dbl:.2,lives:4,forks:1,total:14000},\n norm:{n:'🟡 Нормальный',t:'3 нерва, две смены ветки',col:'linear-gradient(180deg,#ffbf3a,#e08a14)',base:250,gain:170,gap:210,wide:.14,dbl:.32,lives:3,forks:2,total:17000},\n hard:{n:'🔴 Сложный',t:'2 нерва, быстро, три смены ветки',col:'linear-gradient(180deg,#ff6a5a,#c0392b)',base:300,gain:230,gap:200,wide:.2,dbl:.42,lives:2,forks:3,total:20000}\n};\nfunction menu(){\n  $('ov').style.display='flex';\n  $('ov').innerHTML='<div class=\"card\"><h2>📐 Проектирование крана<\/h2><p>Довезите проект до сдачи. ТЗ и поставщиков меняют на ходу, а руководитель проекта может сменить ветку: тогда уезжайте на новую дорогу! Выберите сложность:<\/p>'+Object.entries(DIFF).map(([k,v])=>`<button class=\"bt\" data-d=\"${k}\" style=\"margin-bottom:8px;background:${v.col}\">${v.n}<br><small style=\"font-weight:400\">${v.t}<\/small><\/button>`).join('')+'<\/div>';\n  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>start(b.dataset.d));\n}\nfunction fork(){\n  const gl=R(2)?2:0,c=gl===0?225:135;\n  G.obs.push({x:c,y:-90,w:170,h:70,t:FORK,k:'h',fork:true});\n  G.obs.push({x:LX[gl],y:-90,w:80,h:62,k:'m',gl});\n  G.forkT=2.4;G.forkSide=gl===0?0:1;G.next=Math.max(G.next,900);\n  toast('Руководитель проекта изменил ветку! Уезжайте на '+(gl===0?'левую':'правую')+' дорогу!');snd('warn');\n}\nfunction drawGate(o){\n  const x=o.x,y=o.y;ctx.fillStyle='#1d6b45';rr(x-40,y-31,80,62,10);ctx.fill();ctx.strokeStyle='#5af0a0';ctx.lineWidth=3;ctx.stroke();\n  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='20px sans-serif';ctx.fillText('⬆️',x,y-6);ctx.font='bold 10px sans-serif';ctx.fillText('Новая ветка',x,y+14);ctx.fillText('сюда',x,y+26);\n}\nfunction extras(){\n  ctx.fillStyle='#ffffffaa';ctx.font='bold 11px sans-serif';ctx.textAlign='left';ctx.fillText('ветка: '+BR[(G.br||0)%BR.length],54,18);\n  if(G.forkT>0&&Math.floor(G.t*6)%2){ctx.fillStyle='#ff4d4dee';rr(60,36,240,40,12);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 14px sans-serif';ctx.fillText('РП ИЗМЕНИЛ ВЕТКУ!',180,54);ctx.font='12px sans-serif';ctx.fillText('Уезжайте на новую дорогу '+(G.forkSide<1?'⬅️':'➡️'),180,69)}\n}\nfunction rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}\nfunction toast(t){const e=$('tt');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,2200)}\nfunction start(d){\n  if(typeof d==='string')LD=d;P=DIFF[LD];TOTAL=P.total;\n  G={run:true,lane:1,px:180,dist:0,lives:P.lives,inv:0,slow:0,boost:0,shield:false,obs:[],next:300,cap:0,sup:0,tz:0,sp:0,t:0,br:0,forkT:0,fk:FKS[P.forks].map(f=>f*TOTAL)};snd('ok');\n  $('ov').style.display='none';hud();\n  last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);\n}\nfunction hud(){\n  $('pb').style.width=Math.min(100,G.dist/TOTAL*100)+'%';\n  $('lv').textContent='❤️'.repeat(G.lives)+(G.shield?' 🛡️':'');\n  $('c1').textContent='🏋️ ТЗ: '+CAPS[G.cap]+' т';\n  $('c2').textContent='⚙️ Редуктор: '+SUPS[G.sup];\n}\nfunction spawn(){\n  const r=Math.random(),L=[0,1,2];\n  const add=(lane,t,x,w)=>G.obs.push({x:x??LX[lane],y:-60,w:w||80,h:62,t,k:'h',lane});\n  let free=null;\n  if(r<P.wide){const a=R(2);add(a,WIDE,(LX[a]+LX[a+1])/2,170);free=a===0?2:0}\n  else if(r<.9-P.dbl){const a=R(3);add(a,HZ[R(HZ.length)]);free=[0,1,2].filter(i=>i!==a)[R(2)]}\n  else if(r<.9){const f=R(3);L.filter(i=>i!==f).forEach(i=>add(i,HZ[R(HZ.length)]));free=f}\n  else free=R(3);\n  if(free!==null&&Math.random()<(r>.9?1:.35)){const k=['coffee','ok','calc'][R(3)];G.obs.push({x:LX[free],y:-60,w:44,h:44,t:k,k:'p'})}\n}\nfunction hit(o){\n  const T=o.t;\n  if(G.shield){G.shield=false;snd('ok');toast('Щит спас: вы вовремя согласовали правки!');return}\n  G.lives--;snd('bad');G.inv=1.4;G.slow=T.id==='app'?2.6:1.2;G.dist=Math.max(0,G.dist-500);\n  let m='Правки! Откатились назад.';\n  if(T.id==='tz'){const o2=CAPS[G.cap];G.cap=Math.min(CAPS.length-1,G.cap+1);G.tz++;m='ТЗ изменилось: грузоподъёмность '+o2+' → '+CAPS[G.cap]+' т. Пересчитываем!'}\n  else if(T.id==='sup'){G.sup=(G.sup+1)%SUPS.length;G.sp++;m='Поставщик редуктора сменился: '+SUPS[G.sup]+'. Переделываем узел.'}\n  else if(T.id==='fix')m='Заказчик прислал правки на 40 страниц.';\n  else if(T.id==='app')m='Согласование займёт три недели…';\n  else if(T.id==='gost')m='Вышел новый ГОСТ. Всё перепроверяем.';\n  else if(T.id==='calc')m='Не сошёлся расчёт <\/h2><div style=\"font-size:26px;margin-bottom:6px\">'+(G.lives==3?'⭐⭐⭐':G.lives==2?'⭐⭐':'⭐')+'<\/div><p>ТЗ менялось: '+G.tz+' раз(а), редуктор меняли: '+G.sp+' раз(а). Итоговая грузоподъёмность: '+CAPS[G.cap]+' т.<\/p>');\n  }else card((snd('lose'),'')+'<h2>🚫 Проект закрыт<\/h2><p>Нервы кончились: готово '+Math.round(G.dist/TOTAL*100)+'% проекта. Заказчик сказал, что это «первая итерация».<\/p>');\n}\nfunction draw(){\n  ctx.setTransform(DPR,0,0,DPR,0,0);\n  const pal=PAL[(G.br||0)%PAL.length],g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,pal[0]);g.addColorStop(1,pal[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);\n  ctx.strokeStyle=pal[3];ctx.lineWidth=1;\n  for(let y=-60+roadOff*.6%60;y<H;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}\n  for(let x=0;x<=W;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}\n  ctx.fillStyle='#3d5a9a';ctx.font='10px sans-serif';ctx.textAlign='left';\n  ['Ø120','R40','A-A','М1:5','±0,1'].forEach((s,i)=>{const y=(roadOff*1.3+i*110)%H;ctx.fillText(s,6,y);ctx.fillText(s,322,(y+50)%H)});\n  ctx.fillStyle=pal[2];ctx.fillRect(45,0,270,H);\n  ctx.fillStyle='#e8eaf0';ctx.fillRect(45,0,4,H);ctx.fillRect(311,0,4,H);\n  ctx.fillStyle='#f0a21a';for(let y=-60+roadOff;y<H;y+=60){ctx.fillRect(40,y,5,30);ctx.fillRect(315,y,5,30)}\n  ctx.fillStyle='#ffffff55';for(let y=-60+roadOff;y<H;y+=60){ctx.fillRect(134,y,3,30);ctx.fillRect(224,y,3,30)}\n  const by=G.dist-(TOTAL-530);\n  if(by>-60&&by<H){\n    for(let i=0;i<18;i++)for(let j=0;j<2;j++){ctx.fillStyle=(i+j)%2?'#fff':'#111';ctx.fillRect(49+i*14.5,by+j*14,14.5,14)}\n    ctx.fillStyle='#ffd23f';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('СДАЧА ПРОЕКТА',180,by-6);\n  }\n  for(const o of G.obs){\n    if(o.k==='m'){drawGate(o);continue}\n    if(o.k==='p'){\n      ctx.fillStyle='#32d27a33';ctx.beginPath();ctx.arc(o.x,o.y,30,0,7);ctx.fill();\n      ctx.fillStyle='#1d3a2c';ctx.strokeStyle='#5af0a0';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(o \n shelf(){if(S.f.hook)return say('На стеллаже только коробки.');if(!has('ladder'))return say('На верхней полке что-то блестит, но высоко. Нужна стремянка.');S.f.hook=1;give('hook');say('Со стремянки вы достали с верхней полки крюк.')},\n ladder(){if(S.f.ladder)return say('Стремянка у вас.');S.f.ladder=1;give('ladder');say('Вы взяли стремянку.')},\n bench(){if(S.f.pultOk)return say('Верстак пуст.');if(S.f.pultFix)return wiring();S.f.pultFix=1;say('На верстаке разобранный пульт управления, провода отсоединены. Нужно подключить их правильно (подсказка где-то в бумагах).');setTimeout(wiring,900)},\n pump(){if(!S.f.power)return say('Насосная станция обесточена. Питание включается в щитовой.');if(S.f.pump)return say('Насос работает ровно.');simon()},\n stand(){if(S.f.cyl)return say('Стенд пуст.');if(!S.f.pump)return say('Гидроцилиндр зажат прижимом. Нужно запустить насосную станцию.');S.f.cyl=1;give('cyl');draw();say('Вы вынули гидроцилиндр из стенда.')},\n panel(){S.f.power?say('Питание включено, лампа горит зелёным.'):levers()},\n meter(){say('Счётчик отсчитывает киловатты. Ничего полезного.')},\n cage(){if(S.f.rope)return say('Клетка пуста.');ask('🔐 Замок клетки','отгадка',v=>v==='канат'||v==='трос',()=>{S.f.rope=1;give('rope');say('Замок открылся. Вы забрали бухту стального каната.')});\n  say('На замке табличка с загадкой: «Стальная жила, а на барабан наматываюсь, груз держу, а сам не конь. Кто я?»')}\n};\nfunction start(){\n  S={loc:0,inv:[],f:{},in:{},vis:new Set(),notes:[]};\n  closeM();draw();inv();\n  say('Белый судовой кран в цеху недособран: не хватает цилиндра, блока, каната, крюка и пульта. Обыскивайте помещения, решайте головоломки и несите детали к крану. Мигающая точка значит «ещё не осматривали».');\n}\n$('sv').onpointerdown=e=>{\n  const g=e.target.closest('[data-o]');if(!g||S.won)return;\n  const k=g.dataset.o;snd('tap');A[k]();\n  if(k!=='mst'){S.vis.add(k);draw()}else{g.classList.remove('pop');void g.getBoundingClientRect();g.classList.add('pop')}\n};\n$('nb').onclick=()=>{\n  modal('<h2>📝 Записи<\/h2>'+(S.notes.length?S.notes.map(i=>`<div class=\"fr\"><small style=\"color:var(--mu)\">${NT[i][0]}<\/small><br>${NT[i][1]}<\/div>`).join(''):'<p style=\"color:var(--mu)\">Пока пусто. Осматривайте предметы.<\/p>')+'<button class=\"b\" id=\"cl\" style=\"width:100%\">Закрыть<\/button>');$('cl').onclick=closeM;\n};\n$('rs').onclick=start;\n$('md').onclick=e=>{if(e.target.id==='md')closeM()};\nstart();\n<\/script><\/body><\/html>\n", "warehouse": "<!DOCTYPE html>\n<html lang=\"ru\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Инвентаризация склада<\/title>\n<style>\n:root{--bg:#f1efe9;--card:#fff;--tx:#222;--ac:#c2571a;--mu:#777;--bd:#d8d8d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#16181c;--card:#22252b;--tx:#eee;--ac:#f0883e;--mu:#9a9a9a;--bd:#393d45}}\n:root[data-theme=\"dark\"]{--bg:#16181c;--card:#22252b;--tx:#eee;--ac:#f0883e;--mu:#9a9a9a;--bd:#393d45}\n*{box-sizing:border-box}\nbody{margin:0;background-color:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}\n.w{max-width:480px;margin:0 auto;padding:10px}\nh1{font-size:17px;margin:0 0 6px}\n#hud{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;margin-bottom:6px}\n#sc{border-radius:12px;overflow:hidden;border:1px solid var(--bd);line-height:0}\n#sc svg{width:100%;height:auto;display:block}\n[data-s],[data-a]{cursor:pointer}\n#msg{margin:10px 0;padding:10px 12px;background:var(--card);border-left:4px solid var(--ac);border-radius:8px;min-height:62px}\n.b{width:100%;font-size:16px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff}\n.b:disabled{opacity:.5}\n<\/style><\/head><body><div class=\"w\">\n<h1>📋 Инвентаризация склада<\/h1>\n<div id=\"hud\"><span id=\"h1\"><\/span><span id=\"h2\"><\/span><span id=\"h3\"><\/span><\/div>\n<div id=\"sc\"><svg id=\"sv\" viewBox=\"0 0 360 380\">\n<rect width=\"360\" height=\"330\" fill=\"#cdc7b8\"/><rect width=\"360\" height=\"16\" fill=\"#4a4f57\"/>\n<rect y=\"330\" width=\"360\" height=\"50\" fill=\"#6d7178\"/><rect y=\"352\" width=\"360\" height=\"4\" fill=\"#e5b92b\"/>\n<g id=\"sh\"><\/g>\n<g id=\"kl\" data-a=\"kl\" transform=\"translate(48,368)\"><ellipse cx=\"0\" cy=\"2\" rx=\"16\" ry=\"4\" fill=\"#0004\"/>\n<rect x=\"-9\" y=\"-6\" width=\"7\" height=\"12\" fill=\"#333\"/><rect x=\"2\" y=\"-6\" width=\"7\" height=\"12\" fill=\"#333\"/>\n<rect x=\"-12\" y=\"-36\" width=\"24\" height=\"31\" rx=\"4\" fill=\"#3a6ea5\"/><rect x=\"-5\" y=\"-30\" width=\"10\" height=\"9\" fill=\"#2d5887\"/>\n<circle cx=\"0\" cy=\"-46\" r=\"10\" fill=\"#f1c9a0\"/><rect x=\"-11\" y=\"-60\" width=\"22\" height=\"8\" rx=\"3\" fill=\"#e8892b\"/>\n<circle cx=\"-3.5\" cy=\"-47\" r=\"1.4\" fill=\"#222\"/><circle cx=\"3.5\" cy=\"-47\" r=\"1.4\" fill=\"#222\"/>\n<text id=\"st\" y=\"-66\" text-anchor=\"middle\" font-size=\"20\"><\/text><\/g>\n<\/svg><\/div>\n<div id=\"msg\"><\/div>\n<button class=\"b\" id=\"tea\"><\/button>\n<\/div>\n<script>\n(function(){let ac=null,mute=!!window.__MUTE;\nconst cx=()=>{if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac};\naddEventListener('message',e=>{if(e.data&&typeof e.data.mute==='boolean')mute=e.data.mute});\n['pointerdown','keydown','touchstart'].forEach(v=>addEventListener(v,cx,{passive:true}));\nconst N={tap:[[620,.04,'square',.05,0]],ok:[[660,.09,'sine',.1,0],[990,.14,'sine',.1,.09]],bad:[[170,.2,'sawtooth',.1,0],[110,.25,'sawtooth',.1,.1]],item:[[784,.07,'triangle',.1,0],[988,.07,'triangle',.1,.07],[1318,.12,'triangle',.1,.14]],warn:[[880,.12,'square',.07,0],[880,.12,'square',.07,.2]],win:[[523,.14,'triangle',.12,0],[659,.14,'triangle',.12,.14],[784,.14,'triangle',.12,.28],[1047,.4,'triangle',.12,.42]],lose:[[392,.22,'sawtooth',.1,0],[311,.22,'sawtooth',.1,.22],[233,.5,'sawtooth',.1,.44]]};\nwindow.snd=n=>{if(mute)return;const a=cx();if(!a||!N[n])return;const t=a.currentTime;N[n].forEach(([f,d,ty,v,dl])=>{const o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t+dl);g.gain.exponentialRampToValueAtTime(.0001,t+dl+d);o.connect(g);g.connect(a.destination);o.start(t+dl);o.stop(t+dl+d+.02)})};\n})();\n<\/script>\n<script>\nconst $=id=>document.getElementById(id);\nconst ITEMS=[['📦','Коробки'],['🛢️','Бочки'],['🔩','Крепёж'],['⛓️','Цепи'],['🧰','Ящики'],['🪢','Канаты']];\nITEMS.push(['🧯','Огнетуш.'],['🪛','Инструмент'],['🔌','Кабель'],['🧤','Перчатки'],['🎨','Краска'],['💡','Лампы']);const N=ITEMS.length;const colX=i=>48+(i%4)*88;\nlet S,timer;\nconst say=t=>{$('msg').textContent=t};\nfunction start(){\n  const sh=ITEMS.map(it=>{const a=2+Math.floor(Math.random()*6);return{icon:it[0],name:it[1],act:a,exp:a,ver:false}});\n  [0,1,2].forEach(()=>{const s=sh[Math.floor(Math.random()*N)];s.exp+=Math.random()<.5?1:-1;if(s.exp<1)s.exp=2});\n  S={sh,cnt:null,t:0,moves:0,cd:0,over:false,\n     k:{x:48,tx:48,mode:'idle',wait:10,a:0,b:0,carry:false,busy:0}};\n  clearInterval(timer);timer=setInterval(tick,100);\n  paint();hud();btn();\n  say('Пересчитайте все 12 полок: нажмите на полку и подождите. Но кладовщик то и дело переставляет коробки и сбивает подсчёт. Отвлекайте его чаем!');\n}\nfunction paint(){\n  $('sh').innerHTML=S.sh.map((s,i)=>{\n    const x=6+(i%4)*88,y=24+Math.floor(i/4)*98,cx=x+42;\n    const diff=s.act!==s.exp,c=S.cnt&&S.cnt.i===i;\n    let fact;\n    if(c)fact=`<rect x=\"${x+12}\" y=\"${y+72}\" width=\"60\" height=\"9\" rx=\"4\" fill=\"#0003\"/><rect id=\"pb\" x=\"${x+12}\" y=\"${y+72}\" width=\"0\" height=\"9\" rx=\"4\" fill=\"#2a7a3b\" data-x=\"${x}\"/>`;\n    else if(s.ver)fact=`<text x=\"${cx}\" y=\"${y+81}\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" fill=\"${diff?'#b3261e':'#1f6b33'}\" font-family=\"sans-serif\">факт: ${s.act} ${diff?'⚠':'✓'}<\/text>`;\n    else fact=`<text x=\"${cx}\" y=\"${y+81}\" text-anchor=\"middle\" font-size=\"10\" fill=\"#4a3418\" font-family=\"sans-serif\">👆 пересчитать<\/text>`;\n    return `<g data-s=\"${i}\"><rect x=\"${x}\" y=\"${y}\" width=\"84\" height=\"92\" rx=\"6\" fill=\"#7a5a30\" stroke=\"#4a3418\" stroke-width=\"3\"/><rect x=\"${x+5}\" y=\"${y+5}\" width=\"74\" height=\"82\" rx=\"4\" fill=\"${s.ver?'#c3d9b5':'#a98655'}\"/>\n    <text x=\"${cx}\" y=\"${y+19}\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" fill=\"#2b1d09\" font-family=\"sans-serif\">${s.name}<\/text>\n    <text x=\"${cx}\" y=\"${y+49}\" text-anchor=\"middle\" font-size=\"26\">${s.icon}<\/text>\n    <text x=\"${cx}\" y=\"${y+64}\" text-anchor=\"middle\" font-size=\"9\" fill=\"#2b1d09\" font-family=\"sans-serif\">ведомость: ${s.exp}<\/text>${fact}<\/g>`;\n  }).join('');\n}\nfunction hud(){\n  $('h1').textContent='Проверено: '+S.sh.filter(s=>s.ver).length+'/'+N;\n  $('h2').textContent='⏱ '+Math.floor(S.t/10)+' с';\n  $('h3').textContent='Перестановок: '+S.moves;\n}\nfunction btn(){\n  const b=$('tea');\n  if(S.over){b.textContent='Сыграть снова';b.disabled=false;return}\n  b.disabled=S.cd>0;\n  b.textContent=S.cd>0?'☕ Кладовщик занят… ('+Math.ceil(S.cd/10)+' с)':'☕ Отвлечь кладовщика чаем';\n}\nfunction interrupt(i){if(S.cnt&&S.cnt.i===i){S.cnt=null;snd('bad');say('Кладовщик сбил подсчёт полки «'+S.sh[i].name+'». Придётся начать заново.')}}\nfunction pick(){\n  const ver=S.sh.map((s,i)=>i).filter(i=>S.sh[i].ver&&S.sh[i].act>0);\n  const all=S.sh.map((s,i)=>i).filter(i=>S.sh[i].act>0);\n  const pool=ver.length&&Math.random()<.8?ver:all;\n  const a=pool[Math.floor(Math.random()*pool.length)];\n  let b;do{b=Math.floor(Math.random()*N)}while(b===a);\n  return[a,b];\n}\nfunction tick(){\n  if(S.over)return;\n  S.t++;const k=S.k;\n  if(S.cd>0)S.cd--;\n  if(S.cnt){\n    S.cnt.t--;\n    const pb=$('pb');if(pb)pb.setAttribute('width',60*(1-S.cnt.t/S.cnt.n));\n    if(S.cnt.t<=0){const i=S.cnt.i;S.sh[i].ver=true;snd('ok');S.cnt=null;paint();checkWin()}\n  }\n  if(k.busy>0){k.busy--;$('st').textContent='☕';}\n  else{\n    $('st').textContent=k.carry?'📦':'';\n    if(k.mode==='idle'){\n      if(--k.wait<=0){[k.a,k.b]=pick();k.tx=colX(k.a);k.mode='toA'}\n    }else{\n      const d=k.tx-k.x;\n      if(Math.abs(d)>9)k.x+=Math.sign(d)*9;\n      else{\n        k.x=k.tx;\n        if(k.mode==='toA'){\n          const s=S.sh[k.a];s.act--;s.ver=false;interrupt(k.a);k.carry=true;snd('warn');\n          k.tx=colX(k.b);k.mode='toB';paint();\n          say('Кладовщик взял коробку с полки «'+s.name+'» и куда-то понёс.');\n        }else{\n          const s=S.sh[k.b];s.act++;s.ver=false;interrupt(k.b);k.carry=false;\n          k.mode='idle';k.wait=5+Math.floor(Math.random()*8);S.moves++;paint();\n          say('Кладовщик положил коробку на полку «'+s.name+'». Теперь её надо пересчитать.');\n        }\n      }\n    }\n  }\n  $('kl').setAttribute('transform','translate('+k.x+',368)');\n  hud();btn();\n}\nfunction checkWin(){\n  if(S.sh.every(s=>s.ver)&&!S.k.carry){\n    S.over=true;clearInterval(timer);\n    const d=S.sh.filter(s=>s.act!==s.exp).length;parent.postMessage({win:'warehouse'},'*');snd('win');\n    $('st').textContent='👍';\n    say('Акт подписан! Время: '+Math.floor(S.t/10)+' с, перестановок: '+S.moves+', расхождений с ведомостью: '+d+'.');\n    btn();\n  }\n}\n$('sv').onclick=e=>{\n  if(S.over)return;\n  const a=e.target.closest('[data-a]');if(a){tea();return}\n  const el=e.target.closest('[data-s]');if(!el)return;\n  const i=+el.dataset.s,s=S.sh[i];\n  if(s.ver)return say('Полка «'+s.name+'» уже пересчитана.');\n  if(S.cnt&&S.cnt.i===i)return;\n  S.cnt={i,t:16,n:16};snd('tap');paint();say('Считаю «'+s.name+'»… не отвлекайтесь!');\n};\nfunction tea(){\n  if(S.over)return;\n  if(S.cd>0)return say('Кладовщик ещё допивает прошлый чай.');\n  S.k.busy=50;S.cd=220;snd('tap');\n  say('Вы позвали кладовщика на чай. Несколько секунд спокойной рабо }
function back(){
  cur=null;$('ov').style.display='none';$('fr').srcdoc='';$('game').style.display='none';$('menu').style.display='block';menu();
}
function win(id){
  if(!done.includes(id)){done.push(id);save()}
  const i=L.findIndex(l=>l.id===id),all=done.length===L.length,nx=L[i+1];
  $('ov').style.display='flex';
  $('ov').innerHTML=all?`<div class="card"><h2>🏆 Кран принят!</h2><p>Все шесть участков пройдены: проект сдан, детали закуплены, кран собран, склад сверен, грузы подготовлены, испытания сданы. Отличная работа!</p><button class="bt p" id="b1">В меню</button><button class="bt" id="b2">Остаться в игре</button></div>`
   :`<div class="card"><h2>✅ Участок пройден</h2><p>${L[i].n.slice(3)} завершён. Пройдено ${done.length} из ${L.length}.</p>${nx?`<button class="bt p" id="b3">Дальше: ${nx.n.slice(3)}</button>`:''}<button class="bt" id="b1">В меню</button><button class="bt" id="b2">Остаться в игре</button></div>`;
  $('b1').onclick=back;$('b2').onclick=()=>{$('ov').style.display='none'};
  if($('b3'))$('b3').onclick=()=>{$('ov').style.display='none';open(nx.id)};
}
addEventListener('message',e=>{
  if(e.source===$('fr').contentWindow&&e.data&&e.data.win&&e.data.win===cur)win(cur);
});
$('bk').onclick=back;$('mt').onclick=()=>setMute(!muted);setMute(muted);
$('rs').onclick=()=>{done=[];save();menu()};
menu();
</script></body></html>
